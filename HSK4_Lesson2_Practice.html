<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 4 Lesson 2 Practice</title>
<style>
:root{--ink:#22252b;--navy:#27305e;--red:#b8322a;--blue:#2e5c9a;--grey:#6d6f75;--line:#e3e3e8;--cream:#fbf7ee;--green:#2f8f5b;--bg:#f6f6f9;
 --cn:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Noto Sans SC",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Sans",system-ui,sans-serif;font-size:16px}
.zh{font-family:var(--cn)}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--navy);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;color:var(--navy)}
header h1 .zh{font-size:22px}
.tog{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tog button{padding:7px 14px;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--grey)}
.tog button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tog button.on.bpy{background:var(--red);border-color:var(--red)}
.tog button.on.ben{background:var(--blue);border-color:var(--blue)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0;max-width:1100px;margin:0 auto}
nav button{background:#fff;border:2px solid var(--line);padding:7px 12px;font-weight:700;color:var(--grey)}
nav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
.panel{background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:22px;color:var(--navy)}
.panel h2 .zh{color:var(--red);margin-right:8px}
.hint{color:var(--grey);margin:0 0 12px;font-size:14px}
.hidden{display:none!important}

/* show/hide */
body:not(.showpy) .py{visibility:hidden}
body:not(.showen) .en{visibility:hidden}
body:not(.showpy) .rw i{display:none}
body:not(.showen) .enl{display:none}
.py{color:var(--red);font-weight:600}
.en{color:var(--blue)}
.peek{display:inline-block;font-size:12px;color:#fff;background:var(--grey);border-radius:6px;padding:1px 7px;margin-left:6px;cursor:pointer;vertical-align:middle}
.rev .py,.rev .en{visibility:visible!important}
.rev .rw i{display:block!important}
.rev .enl{display:block!important}

/* vocab */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:2px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;position:relative;cursor:pointer}
.card:hover{border-color:var(--navy)}
.card .no{position:absolute;top:6px;left:8px;font-size:11px;color:#aaa}
.card .pos{position:absolute;top:6px;right:8px;font-size:11px;color:#aaa;font-style:italic}
.card .emo{font-size:36px;line-height:1.1}
.card .w{font-size:26px;font-weight:700;margin-top:2px}
.card .py{display:block;font-size:14px;min-height:20px}
.card .en{display:block;font-size:13px;min-height:18px}
.card .say{margin-top:6px;background:#eef2ff;color:var(--navy);padding:3px 10px;font-size:13px}

/* texts */
.scene{color:var(--grey);font-size:14px;margin:0 0 10px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;padding:8px 0;border-bottom:1px dotted var(--line)}
.dl.para{grid-template-columns:1fr}
.who{font-weight:700;color:var(--navy)}
.who small{display:block;font-weight:400;color:var(--grey);font-size:12px}
.dz{font-size:21px;line-height:1.5}
.rw{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:0 2px 2px}
.rw i{font-style:normal;font-size:11px;color:var(--red);font-weight:600;line-height:1.1;white-space:nowrap}
.rw b{font-weight:400}
.rw.tg b{color:var(--red);font-weight:700}
.enl{grid-column:1/-1;color:var(--blue);font-size:14px;margin-top:2px}
.dl.para .enl{grid-column:1}
.lineb{display:flex;gap:6px;margin-top:4px}
.lineb button{font-size:12px;padding:2px 8px;background:#f0f0f4;color:var(--grey)}

/* questions */
.q{border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.q .qt{font-size:18px;margin-bottom:6px}
.q .qt .n{display:inline-block;background:var(--navy);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;margin-right:8px}
.q .qt .py,.q .qt .en{display:block;font-size:13px;margin-left:32px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:#f4f6fb;border:2px solid #dfe5f5;padding:7px 14px;font-size:17px;border-radius:10px;text-align:left}
.opt small{display:block;font-size:11px;color:var(--red)}
.opt:hover{border-color:var(--navy)}
.opt.right{background:#dff7e9;border-color:var(--green)}
.opt.wrong{background:#ffe3e3;border-color:var(--red)}
.opt:disabled{cursor:default}
.fb{margin-top:6px;font-weight:700;font-size:14px;min-height:18px}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.score{font-weight:800;color:var(--navy);margin-left:auto}
.qh{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
.qh h3{margin:0;font-size:17px;color:var(--red)}
.bank{background:var(--cream);border-radius:10px;padding:8px 12px;margin:6px 0 10px;font-size:18px;display:flex;gap:14px;flex-wrap:wrap}
.bank span{position:relative}
.bank .py{display:block;font-size:11px}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pic{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.pic .e{font-size:38px}
.pic input{width:100%;font:inherit;font-size:18px;text-align:center;border:none;border-bottom:2px solid #444;padding:4px;font-family:var(--cn)}
.pic.right{border-color:var(--green);background:#eefbf3}
.pic.wrong{border-color:var(--red);background:#fff2f2}
.pic .ans{font-size:13px;color:var(--red);min-height:16px}
.fill{font-size:19px}
.fill select{font:inherit;font-size:17px;font-family:var(--cn);border:2px solid #bbb;border-radius:8px;padding:2px 6px;background:#fff}
.fill select.right{border-color:var(--green);background:#eefbf3}
.fill select.wrong{border-color:var(--red);background:#fff2f2}
.tfb{display:flex;gap:8px}
.tfb .opt{min-width:80px;text-align:center}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px}
.mi{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:20px;cursor:pointer;font-family:var(--cn)}
.mi.sel{border-color:var(--navy);background:#eef2ff}
.mi.done{border-color:var(--green);background:#dff7e9;cursor:default}
.mi.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.order .pool,.order .ans{display:flex;gap:6px;flex-wrap:wrap;min-height:46px;padding:6px;border-radius:10px}
.order .pool{background:#f4f6fb}
.order .ans{border:2px dashed #bbb;margin-bottom:6px}
.order .chip{background:#fff;border:2px solid var(--line);border-radius:8px;padding:5px 10px;font-size:19px;cursor:pointer;font-family:var(--cn)}
.order .ans .chip{background:#eef2ff;border-color:#c9d3f5}
.order .ans.right{border-color:var(--green);background:#eefbf3}
.order .ans.wrong{border-color:var(--red);background:#fff2f2}
.order .ctl{display:flex;gap:6px}
.order .ctl button{background:var(--navy);color:#fff;padding:4px 12px;font-size:14px}
.order .ctl button.light{background:#f0f0f4;color:var(--grey)}
.big{background:var(--green);color:#fff;font-weight:800;padding:10px 20px;font-size:16px}
.big.navy{background:var(--navy)}

/* grammar */
.gr{border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.gr h3{margin:0;font-size:20px;color:var(--navy)}
.gr h3 small{color:var(--grey);font-weight:400;font-size:13px;margin-left:8px}
.gr .rule{margin:6px 0}
.formula{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.formula span{background:#eef3fb;border-radius:8px;padding:3px 10px;font-size:18px;font-family:var(--cn)}
.formula span:first-child{background:#fde8e6;color:var(--red);font-weight:700}
.ex{margin:6px 0 6px 8px;font-size:19px}
.ex .py,.ex .en{display:block;font-size:13px}
.mist{font-size:13px;color:#7a5200;background:#fff7e0;border-radius:8px;padding:4px 10px;display:inline-block}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.ph div{border-bottom:1px dotted #ccc;padding:5px 0;font-size:19px}
.ph .py,.ph .en{display:block;font-size:13px}

/* story */
.lp{font-size:21px;line-height:1.6;margin:0 0 8px}
.step{display:flex;gap:8px;margin:14px 0 6px;align-items:center}
.step b{background:var(--navy);color:#fff;border-radius:6px;padding:2px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;z-index:60;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
@media (max-width:640px){.dl{grid-template-columns:1fr}.dz{font-size:19px}.match{grid-template-columns:1fr 1fr}}
</style>
</head>

  <p class="hint">Use the Pinyin / Meaning buttons at the top to hide them and test yourself. Tap 👁 on a card to peek at one word. 🔊 reads it aloud.</p>
  <div class="cards">${D.vocab.map(v=>`<div class="card" onclick="peek(this)"><span class="no">${v.n}</span><span class="pos">${esc(v.pos)}</span>
    <div class="emo">${v.emo}</div><div class="w zh">${v.w}</div><span class="py">${esc(v.py)}</span><span class="en">${esc(v.m)}</span>
    <button class="say" onclick="event.stopPropagation();say('${v.w}')">🔊</button></div>`).join('')}</div></div>`;
}
function mcq(q, opts, a, key){
  return `<div class="q" data-k="${key}"><div class="qt"><span class="n">${key.split('-').pop()}</span><span class="zh">${esc(q.q||q.s||q.w)}</span>
    ${q.py?`<span class="py">${esc(q.py)}</span>`:''}${q.en?`<span class="en">${esc(q.en)}</span>`:''}</div>
    <div class="opts">${opts.map((o,j)=>`<button class="opt zh" onclick="pick(this,${j},${a})"><b>${L[j]}</b> ${esc(o)}</button>`).join('')}</div><div class="fb"></div></div>`;
}
function pick(b,j,a){
  const q=b.closest('.q'); if(q.dataset.done) return; q.dataset.done=1;
  q.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  const ok=j===a; b.classList.add(ok?'right':'wrong'); if(!ok) q.querySelectorAll('.opt')[a].classList.add('right');
  const fb=q.querySelector('.fb'); fb.textContent = ok?'✔ 对了！':'✘ 答案是 '+L[a]; fb.className='fb '+(ok?'ok':'no');
  bump(ok);
}
let SC={right:0,total:0};
function bump(ok){ SC.total++; if(ok) SC.right++; document.querySelectorAll('.score').forEach(e=>e.textContent=`Score: ${SC.right} / ${SC.total}`); }

function vText(n){
  const t=D.texts[n-1];
  const lines=t.lines.map(l=>`<div class="dl${l.sp?'':' para'}">${l.sp?`<div class="who zh">${l.sp}<small>${esc(l.spe)}</small></div>`:''}
    <div><div class="dz zh">${units(l.u)}</div><div class="lineb"><button onclick="say('${plain(l.u).replace(/'/g,'')}')">🔊</button><button onclick="peek(this)">👁 show</button></div></div>
    <div class="enl">${esc(l.en)}</div></div>`).join('');
  return `<div class="panel"><h2><span class="zh">课文${n}</span>Text ${n} · ${esc(t.title_en)} <small class="zh" style="color:#888;font-size:14px">${t.title}</small></h2>
  ${t.scene?`<p class="scene">📍 <span class="zh">${t.scene}</span> <span class="en">${esc(t.scene_en)}</span></p>`:''}${lines}
  <div class="qh"><h3>✅ Check your understanding</h3><span class="score">Score: ${SC.right} / ${SC.total}</span></div>
  ${t.q.map((q,i)=>mcq(q,q.opts,q.a,`t${n}-${i+1}`)).join('')}</div>`;
}
function vGrammar(){
  return `<div class="panel"><h2><span class="zh">小语讲堂</span>Grammar</h2>
  ${D.grammar.map(g=>`<div class="gr"><h3><span class="zh">${g.n} · ${g.name}</span><small>${esc(g.kind)}</small></h3><p class="rule">${esc(g.rule)}</p>
   <div class="formula">${g.formula.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
   ${g.ex.map(e=>`<div class="ex zh">${esc(e.zh)} <button class="peek" onclick="peek(this)">👁</button><span class="py">${esc(e.py)}</span><span class="en">${esc(e.en)}</span></div>`).join('')}
   <span class="mist">⚠ ${esc(g.mistake)}</span></div>`).join('')}
  <h2 style="margin-top:14px"><span class="zh">常用短语</span>Useful phrases</h2>
  <div class="ph">${D.phrases.map(p=>`<div><span class="zh">${p.zh}</span> <button class="peek" onclick="peek(this)">👁</button><span class="py">${esc(p.py)}</span><span class="en">${esc(p.en)}</span></div>`).join('')}</div></div>`;
}
function vStory(){
  return `<div class="panel"><h2><span class="zh">阅读</span>Reading ladder</h2>
  <p class="hint">Step 1: read with pinyin and meaning on. Step 2: turn Meaning off. Step 3: turn Pinyin off and read aloud. Then answer 对 / 错.</p>
  ${D.story.map(p=>`<p class="lp zh">${units(p.u)}</p><p class="enl" style="margin:-4px 0 12px">${esc(p.en)}</p>`).join('')}
  <div class="qh"><h3>对 / 错</h3><span class="score">Score: ${SC.right} / ${SC.total}</span></div>
  ${D.storyTF.map((q,i)=>`<div class="q tfrow"><div class="qt"><span class="n">${i+1}</span><span class="zh">${q.s}</span><span class="py">${esc(q.py)}</span></div>
   <div class="tfb"><button class="opt zh" onclick="pick(this,1,${q.a?1:0})">对 ✔</button><button class="opt zh" onclick="pick(this,0,${q.a?1:0})">错 ✘</button></div><div class="fb"></div></div>`).join('')}</div>`;
}
function vQuiz(){
  const Q=D.quiz;
  const A=`<div class="qh"><h3>A · Look at the picture, type the word</h3></div><div class="bank zh">${Q.A.bank.map(w=>`<span>${w}</span>`).join('')}</div>
   <div class="pics">${Q.A.items.map((it,i)=>`<div class="pic" data-a="${it.a}"><div class="e">${it.emo}</div><input placeholder="${i+1}" oninput="chkA(this)"><div class="ans"></div></div>`).join('')}</div>`;
  const B=`<div class="qh"><h3>B · Choose the meaning</h3></div>${Q.B.map((q,i)=>mcq({w:q.w,py:q.py},q.opts,q.a,`B-${i+1}`)).join('')}`;
  const C=`<div class="qh"><h3>C · Grammar: choose the best word</h3></div>${Q.C.map((q,i)=>mcq({s:q.s,py:q.py},q.opts,q.a,`C-${i+1}`)).join('')}`;
  const Dd=`<div class="qh"><h3>D · 对 or 错? About the texts</h3></div>${Q.D.map((q,i)=>`<div class="q tfrow"><div class="qt"><span class="n">${i+1}</span><span class="zh">${q.s}</span><span class="py">${esc(q.py)}</span></div>
   <div class="tfb"><button class="opt zh" onclick="pick(this,1,${q.a?1:0})">对 ✔</button><button class="opt zh" onclick="pick(this,0,${q.a?1:0})">错 ✘</button></div><div class="fb">${q.c?'':''}</div></div>`).join('')}`;
  const E=`<div class="qh"><h3>E · Fill in the blanks</h3></div><div class="bank zh">${Q.E.bank.map(w=>`<span>${w}</span>`).join('')}</div>
   ${Q.E.items.map((it,i)=>{const sel=`<select onchange="chkE(this,'${it.a}')"><option value="">＿＿</option>${Q.E.bank.map(w=>`<option>${w}</option>`).join('')}</select>`;
     return `<div class="q"><div class="fill zh"><span class="n" style="display:inline-block;background:var(--navy);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;margin-right:8px">${i+1}</span>${it.s.replace('＿＿',sel)}<span class="py" style="display:block;font-size:13px;margin-left:32px">${esc(it.py)}</span></div><div class="fb"></div></div>`;}).join('')}`;
  const F=`<div class="qh"><h3>F · Match the verb with its partner</h3></div><p class="hint">Tap a verb, then its partner.</p><div class="match">
   <div>${Q.F.l.map(w=>`<div class="mi" data-l="${w}" onclick="mSel(this)">${w}</div>`).join('')}</div>
   <div>${[...Q.F.r].sort(()=>0.5-Math.random()).map(w=>`<div class="mi" data-r="${w}" onclick="mPick(this)">${w}</div>`).join('')}</div></div>`;
  const G=`<div class="qh"><h3>G · Put the words in order</h3></div><p class="hint">Tap the chips in order. Tap a chip in the answer row to send it back.</p>
   ${Q.G.map((q,i)=>`<div class="q order" data-a="${q.a}"><div class="ans" onclick="oBack(event)"></div><div class="pool">${[...q.parts].sort(()=>0.5-Math.random()).map(p=>`<span class="chip" onclick="oAdd(this)">${p}</span>`).join('')}</div>
    <div class="ctl"><button onclick="oChk(this)">Check</button><button class="light" onclick="oReset(this)">Reset</button></div><div class="fb"></div><div class="py" style="font-size:13px">${esc(q.py)}</div></div>`).join('')}`;
  return `<div class="panel"><h2><span class="zh">测验</span>Quiz <span class="score" style="float:right">Score: ${SC.right} / ${SC.total}</span></h2>
   <p class="hint">Hide Pinyin and Meaning with the buttons at the top for a real test. Answers are checked as you go.</p>${A}${B}${C}${Dd}${E}${F}${G}</div>`;
}
function chkA(inp){ const p=inp.closest('.pic'); const v=inp.value.trim(); if(!v){p.className='pic';return;}
  const ok=v===p.dataset.a; p.className='pic '+(ok?'right':'wrong'); p.querySelector('.ans').textContent = ok?'✔':''; if(ok&&!p.dataset.done){p.dataset.done=1;bump(true);} }
function chkE(sel,a){ const ok=sel.value===a; sel.className=ok?'right':'wrong'; const fb=sel.closest('.q').querySelector('.fb'); fb.textContent=ok?'✔':'✘ try again'; fb.className='fb '+(ok?'ok':'no'); if(ok&&!sel.dataset.done){sel.dataset.done=1;bump(true);} }
let mcur=null;
function mSel(el){ if(el.classList.contains('done')) return; document.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); mcur=el; }
function mPick(el){ if(!mcur||el.classList.contains('done')) return; const ok=D.quiz.F.ans[mcur.dataset.l]===el.dataset.r;
  if(ok){ mcur.classList.remove('sel'); mcur.classList.add('done'); el.classList.add('done'); el.textContent=mcur.dataset.l+el.dataset.r; mcur=null; bump(true); }
  else { el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),350); bump(false); } }
function oAdd(ch){ ch.closest('.order').querySelector('.ans').appendChild(ch); }
function oBack(e){ if(e.target.classList.contains('chip')) e.target.closest('.order').querySelector('.pool').appendChild(e.target); }
function oChk(b){ const o=b.closest('.order'); const got=[...o.querySelectorAll('.ans .chip')].map(c=>c.textContent).join('').replace(/\s/g,''); const ans=o.dataset.a.replace(/[，。]/g,'');
  const ok=got===ans; o.querySelector('.ans').className='ans '+(ok?'right':'wrong'); const fb=o.querySelector('.fb'); fb.textContent=ok?'✔ '+o.dataset.a:'✘ not yet'; fb.className='fb '+(ok?'ok':'no'); if(ok&&!o.dataset.done){o.dataset.done=1;bump(true);} }
function oReset(b){ const o=b.closest('.order'); o.querySelectorAll('.ans .chip').forEach(c=>o.querySelector('.pool').appendChild(c)); o.querySelector('.ans').className='ans'; o.querySelector('.fb').textContent=''; }

function render(){
  const v=$('#view');
  if(tab==='words') v.innerHTML=vWords();
  else if(tab[0]==='t') v.innerHTML=vText(+tab[1]);
  else if(tab==='grammar') v.innerHTML=vGrammar();
  else if(tab==='story') v.innerHTML=vStory();
  else v.innerHTML=vQuiz();
  if(document.body.classList.contains('nonew')) document.querySelectorAll('.rw.tg').forEach(e=>e.classList.add('tg0'));
}
const st=document.createElement('style'); st.textContent='.rw.tg.tg0 b{color:inherit;font-weight:400}.rw.tg.tg0 i{color:var(--red);font-weight:600}'; document.head.appendChild(st);
renderNav(); render();
</script>
</body>
</html>
